name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    name: Python 3.11 CPU
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HF_HUB_OFFLINE: "1"
      PYTHONHASHSEED: "0"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install from fresh checkout
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev,huggingface,research]"
          python -m pip check
      - name: Static quality
        run: |
          python -m ruff format --check .
          python -m ruff check .
          python -m mypy src/modelpact
      - name: Unit, property, security, and integration tests
        run: python -m pytest
      - name: Build and reinstall wheel
        run: |
          python -m build
          python -m pip install --force-reinstall --no-deps dist/modelpact-*.whl
          python -c "import importlib.metadata; assert importlib.metadata.version('modelpact')"
          modelpact --help
      - name: Execute offline ModelPactBench CPU suite
        run: |
          mkdir -p artifacts/modelpactbench
          python benchmarks/run.py --config benchmarks/closure_matrix/config.json --output artifacts/modelpactbench/closure-matrix.json
          python benchmarks/run.py --config benchmarks/collusion/config.json --output artifacts/modelpactbench/collusion.json
          python benchmarks/run.py --config benchmarks/merge/config.json --output artifacts/modelpactbench/merge.json
          python benchmarks/run.py --config benchmarks/rebase/config.json --output artifacts/modelpactbench/rebase.json
          python benchmarks/run.py --config benchmarks/cegis/config.json --output artifacts/modelpactbench/cegis.json
          python -m modelpact.modelpactbench.runner forkbench --output artifacts/modelpactbench/forkbench.json --artifacts artifacts/modelpactbench/forkbench-run
          python -m modelpact.modelpactbench.runner r1_loop --output artifacts/modelpactbench/r1-loop.json --artifacts artifacts/modelpactbench/r1-loop-run
          python -m modelpact.modelpactbench.runner huggingface_local --output artifacts/modelpactbench/huggingface-local.json --artifacts artifacts/modelpactbench/huggingface-local-run
          python -m pip freeze > artifacts/modelpactbench/environment.txt
      - name: Upload raw CPU evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: modelpactbench-cpu-python-3.11
          path: artifacts/modelpactbench
          if-no-files-found: ignore
          retention-days: 14
